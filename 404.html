<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>404 — Página no encontrada | LPIC-1</title>
  <style>
    :root {
      --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --text-muted: #475569;
      --border: #E2E8F0; --primary: #2563EB; --primary-soft: #DBEAFE;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 580px;
      box-shadow: 0 10px 30px rgba(15,23,42,0.06);
    }
    h1 { font-size: 80px; font-weight: 800; color: var(--primary); margin-bottom: 8px; line-height: 1; }
    h2 { font-size: 26px; font-weight: 700; margin-bottom: 16px; }
    p { font-size: 18px; color: var(--text-muted); margin-bottom: 32px; line-height: 1.5; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--primary);
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 18px;
    }
    .btn:hover { background: #1D4ED8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>El recurso solicitado no existe o corresponde a un subtema que se irá habilitando en próximas sesiones del curso LPIC-1.</p>
    <a href="./index.html" class="btn">Volver al Índice de Diapositivas</a>
  </div>
</body>
</html>
